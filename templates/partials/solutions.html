<section class="solutions section" id="solutions">
  <div class="container">
    <div class="section-head reveal">
      <p class="kicker">{{solutions.kicker}}</p>
      <h2 class="section-title">{{solutions.title}}</h2>
      <p class="section-intro">{{solutions.intro}}</p>
    </div>

    <div class="solutions-grid">
      {{#each solutions.items}}
      <article class="solution-card reveal" id="{{id}}">
        <div class="solution-card__top">
          <span class="solution-card__icon" aria-hidden="true">{{{iconSvg}}}</span>
          <span class="status-badge status-badge--{{status}}">{{statusLabel}}</span>
        </div>
        <div>
          <h3 class="solution-card__title">{{title}}</h3>
          <p class="solution-card__desc">{{description}}</p>
        </div>
        <ul class="solution-card__topics">
          {{#each topics}}<li>{{this}}</li>{{/each}}
        </ul>
      </article>
      {{/each}}
    </div>
  </div>
</section>
