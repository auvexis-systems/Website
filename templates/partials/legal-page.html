<section class="legal-page section">
  <div class="container legal-page__container">
    <h1>{{legalContent.title}}</h1>
    {{#if legalContent.lastUpdated}}<p class="legal-meta">{{legalContent.lastUpdated}}</p>{{/if}}
    {{#if legalContent.translationNotice}}<p class="legal-notice">{{legalContent.translationNotice}}</p>{{/if}}

    <div class="legal-body">{{{legalContent.bodyHtml}}}</div>

    {{#if legalContent.sourceNote}}<p class="legal-source">{{{legalContent.sourceNote}}}</p>{{/if}}
  </div>
</section>
