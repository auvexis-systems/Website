<section class="section section--tight" id="about">
  <div class="container">
    <div class="about-block reveal">
      <div>
        <p class="kicker">{{about.kicker}}</p>
        <h2 class="section-title">{{about.title}}</h2>
      </div>
      <div class="about-block__text">
        {{#each about.paragraphs}}<p>{{this}}</p>{{/each}}
      </div>
    </div>
  </div>
</section>
