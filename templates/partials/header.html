<header class="site-header" data-header>
  <div class="container site-header__inner">
    <a class="brand" href="{{page.homeHref}}">
      <img class="brand__mark" src="{{page.assetsPrefix}}assets/logo-mark.svg" alt="" width="30" height="30">
      <span class="brand__word">AUVEXIS <span class="brand__word-sub">SYSTEMS</span></span>
    </a>

    <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="main-nav">
      <span class="visually-hidden" data-nav-toggle-label>{{header.menuOpen}}</span>
      <span class="nav-toggle__box"><span></span><span></span><span></span></span>
    </button>

    <nav class="main-nav" id="main-nav" aria-label="Hauptnavigation">
      <ul class="main-nav__list">
        {{#each header.nav}}
        <li><a class="main-nav__link" href="{{fullHref}}">{{label}}</a></li>
        {{/each}}
      </ul>
      <a class="btn btn--primary header-cta" href="{{page.homeHref}}#contact">{{header.cta}}</a>
    </nav>

    <div class="header-actions">
      <div class="lang-switch" aria-label="{{header.langSwitchLabel}}">
        <a href="{{page.deHref}}" aria-current="{{page.isDe}}">DE</a>
        <span class="lang-switch__divider">|</span>
        <a href="{{page.enHref}}" aria-current="{{page.isEn}}">EN</a>
      </div>
      <a class="btn btn--primary btn--sm header-cta-compact" href="{{page.homeHref}}#contact">{{header.cta}}</a>
    </div>
  </div>
</header>
