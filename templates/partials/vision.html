<section class="section" id="vision">
  <div class="container">
    <div class="vision-panel reveal">
      <div class="vision-panel__head">
        <p class="kicker" style="margin-bottom:0">{{vision.kicker}}</p>
        <span class="status-badge status-badge--{{vision.status}}">{{vision.statusLabel}}</span>
      </div>
      <h2 class="vision-panel__title">{{vision.title}}</h2>
      <p class="vision-panel__subtitle">{{vision.subtitle}}</p>
      <div class="vision-panel__text">
        {{#each vision.paragraphs}}<p>{{this}}</p>{{/each}}
      </div>
    </div>
  </div>
</section>
